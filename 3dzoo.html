<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wildlife Wonderland 3D Zoo</title>

  <!-- A-Frame 1.8.0 -->
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #title {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      color: white;
      background: rgba(0,0,0,.55);
      padding: 12px 22px;
      border-radius: 30px;
      font-size: 20px;
      font-weight: bold;
      pointer-events: none;
      text-align: center;
    }

    #info {
      position: fixed;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      color: white;
      background: rgba(0,0,0,.55);
      padding: 10px 18px;
      border-radius: 20px;
      pointer-events: none;
      text-align: center;
    }
  </style>
</head>

<body>

<div id="title">🌿 WILDLIFE WONDERLAND 🦁</div>
<div id="info">Click an animal • Look around • WASD to explore</div>

<a-scene
  background="color: #87CEEB"
  renderer="antialias: true; colorManagement: true"
  fog="type: exponential; color: #b9e6c3; density: 0.015"
  shadow="type: pcfsoft">

  <!-- =========================================================
       ASSETS
  ========================================================== -->

  <a-assets>

    <!-- Lion -->
    <a-mixin id="fur" material="color:#C58A35; roughness:1"></a-mixin>
    <a-mixin id="dark" material="color:#24180F; roughness:1"></a-mixin>
    <a-mixin id="white" material="color:#F5F1DF; roughness:1"></a-mixin>
    <a-mixin id="black" material="color:#111111; roughness:1"></a-mixin>
    <a-mixin id="green" material="color:#267A3B; roughness:1"></a-mixin>

  </a-assets>


  <!-- =========================================================
       LIGHTING
  ========================================================== -->

  <a-light
    type="ambient"
    color="#ffffff"
    intensity="0.75">
  </a-light>

  <a-light
    type="directional"
    position="-20 30 10"
    intensity="1.8"
    castShadow="true"
    shadow-mapSize-width="2048"
    shadow-mapSize-height="2048">
  </a-light>


  <!-- =========================================================
       SKY / ENVIRONMENT
  ========================================================== -->

  <a-sky color="#79C9F2"></a-sky>

  <!-- Sun -->
  <a-sphere
    position="-35 35 -70"
    radius="5"
    material="color:#FFF4A3; emissive:#FFF4A3">
  </a-sphere>


  <!-- Mountains -->
  <a-cone
    position="-35 7 -80"
    radius-bottom="35"
    radius-top="0"
    height="25"
    color="#5C8063">
  </a-cone>

  <a-cone
    position="5 9 -95"
    radius-bottom="45"
    radius-top="0"
    height="32"
    color="#496F57">
  </a-cone>

  <a-cone
    position="50 8 -85"
    radius-bottom="35"
    radius-top="0"
    height="28"
    color="#668C68">
  </a-cone>


  <!-- Clouds -->
  <a-entity position="-20 18 -40">
    <a-sphere radius="3" color="#ffffff"></a-sphere>
    <a-sphere position="3 0 0" radius="4" color="#ffffff"></a-sphere>
    <a-sphere position="7 0 0" radius="3" color="#ffffff"></a-sphere>
  </a-entity>

  <a-entity position="25 22 -55">

  <!-- =========================================================
       GROUND
  ========================================================== -->

    rotation="-90 0 0"
    width="180"
    height="180"
    color="#5FAE55"
    shadow="receive:true">
  </a-plane>


  <!-- Dirt walking paths -->
  <a-plane
    rotation="-90 0 0"
    position="0 0.02 0"
    width="9"
    height="150"
    color="#B58A5A">
  </a-plane>

  <a-plane
    rotation="-90 0 0"
    position="0 0.025 -25"
    width="100"
    height="8"
    color="#B58A5A">
